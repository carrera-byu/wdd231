<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD231 - Home</title>
    <meta name="description" content="Página inicial WDD231 - Home">
    <meta name="author" content="Seu Nome">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Roboto, sans-serif
        }

        header {
            display: grid;
            grid-template-columns: 44px auto 44px;
            align-items: center;
            padding: 10px;
            background: #0a3d62;
            color: #fff
        }

        .hamburger {
            background: none;
            border: none;
            color: #fff;
            font-size: 2.2rem;
            cursor: pointer;
            width: 44px;
            height: 44px
        }

        .hamburger::before {
            content: "\2630"
        }

        .hamburger.exibir::before {
            content: "\00D7"
        }

        .navegacao {
            display: none;
            background: #222
        }

        .navegacao.exibir {
            display: block
        }

        .navegacao ul {
            list-style: none
        }

        .navegacao a {
            display: block;
            padding: 1rem;
            color: #fff;
            text-decoration: none
        }

        .navegacao a:hover {
            background: #444
        }

        .atual a {
            background: #000
        }

        main {
            padding: 1rem;
            max-width: 1000px;
            margin: 0 auto
        }

        h1,
        h2 {
            margin: 1rem 0
        }

        #cursos {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-top: 1rem
        }

        .curso {
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid #ccc;
            background: #eee;
            text-align: center
        }

        .completo {
            background: #0a3d62;
            color: #fff
        }

        footer {
            background: #0a3d62;
            color: #fff;
            text-align: center;
            padding: 1rem;
            margin-top: 1rem
        }

        .filtros {
            display: flex;
            gap: 10px;
            margin: 1rem 0
        }

        .filtros button {
            padding: .5rem 1rem;
            cursor: pointer
        }

        @media screen and (min-width:640px) {
            .hamburger {
                display: none
            }

            .navegacao {
                display: block
            }

            .navegacao ul {
                display: flex
            }

            .navegacao li {
                flex: 1
            }

            main {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 1rem
            }

            main h1,
            #certificados {
                grid-column: 1/3
            }

            #cursos {
                grid-template-columns: repeat(3, 1fr)
            }
        }
    </style>
</head>

<body>
    <header>
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 5L3 9l9 4 9-4-9-4z" />
            <path d="M3 9v4l9 4 9-4V9" />
            <path d="M7 10.5a2.5 2.5 0 0 0 0 5" />
        </svg>
        <span>Victor Carrera</span>
        <button id="botao-de-nav" class="hamburger" aria-label="navegacao"></button>
    </header>
    <nav id="barra-navegacao" class="navegacao">
        <ul>
            <li class="atual"><a href="#">Página Inicial</a></li>
            <li><a href="#">Projeto da Câmara</a></li>
            <li><a href="#">Projeto Final</a></li>
        </ul>
    </nav>
    <main>
        <h1>Página Inicial</h1>
        <section>
            <h2>Sobre Mim</h2>
            <p>Estudante de Desenvolvimento Web - WDD231. Aprendendo HTML, CSS y JavaScript.</p>
        </section>
        <section>
            <h2>Foto do Estudante</h2>
            <p style="background:#ddd;height:200px;display:grid;place-items:center">Sua foto aqu</p>
        </section>
        <section id="certificados">
            <h2>Certificados</h2>
            <div class="filtros">
                <button id="todos">Todos Cursos</button>
                <button id="wdd">WDD</button>
                <button id="cse">CSE</button>
            </div>
            <div id="cursos"></div>
            <p style="margin-top:1rem">Total de Créditos: <span id="creditos"></span></p>
        </section>
    </main>
    <footer>
        <p>&copy; <span id="anoAtual"></span> Victor Carrera - Brasil</p>
        <p id="ultimaModificacao"></p>
    </footer>
    <script>
        const botao = document.querySelector('#botao-de-nav');
        const nav = document.querySelector('#barra-navegacao');
        botao.addEventListener('click', () => { botao.classList.toggle('exibir'); nav.classList.toggle('exibir'); });
        document.querySelector('#anoAtual').textContent = new Date().getFullYear();
        document.querySelector('#ultimaModificacao').textContent = `Última modificação: ${document.lastModified}`;
        const cursos = [{ subject: 'CSE', number: 110, credits: 2, completed: true }, { subject: 'WDD', number: 130, credits: 2, completed: true }, { subject: 'CSE', number: 111, credits: 2, completed: false }, { subject: 'CSE', number: 210, credits: 2, completed: false }, { subject: 'WDD', number: 131, credits: 2, completed: true }, { subject: 'WDD', number: 231, credits: 2, completed: false }];
        function mostrar(lista) { const cont = document.querySelector('#cursos'); cont.innerHTML = ''; lista.forEach(c => { const d = document.createElement('div'); d.className = c.completed ? 'curso completo' : 'curso'; d.textContent = `${c.subject} ${c.number}`; cont.appendChild(d); }); document.querySelector('#creditos').textContent = lista.reduce((a, c) => a + c.credits, 0); }
        mostrar(cursos);
        document.querySelector('#todos').addEventListener('click', () => mostrar(cursos));
        document.querySelector('#wdd').addEventListener('click', () => mostrar(cursos.filter(c => c.subject === 'WDD')));
        document.querySelector('#cse').addEventListener('click', () => mostrar(cursos.filter(c => c.subject === 'CSE')));
    </script>
</body>

</html>
