<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Formulário Avançado</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 650px;
            margin: 20px auto;
            padding: 20px;
            background: #f0f2f5;
        }


        h1 {
            text-align: center;
        }

        fieldset {
            background: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        legend {
            font-weight: bold;
            color: #007bff;
        }

        label {
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            margin: 5px 0 15px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1>Formulário de Cadastro</h1>
    <form action="confirmacao.html" method="GET">
        <fieldset>
            <legend>Dados Pessoais</legend>
            <label for="nome">Nome completo:</label>
            <input type="text" id="nome" name="nome" required placeholder="Ex: Victor Carrera">
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" required>
            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" required minlength="6">
            <label for="nascimento">Data de nascimento:</label>
            <input type="date" id="nascimento" name="nascimento" required>
        </fieldset>
        <fieldset>
            <legend>Preferências</legend>
            <p>Como você nos conheceu?</p>
            <input type="radio" id="google" name="origem" value="Google" checked> <label for="google">Google</label><br>
            <input type="radio" id="amigo" name="origem" value="Amigo"> <label for="amigo">Amigo</label><br>
            <input type="radio" id="rede" name="origem" value="Rede Social"> <label for="rede">Rede
                Social</label><br><br>
            <p>Interesses:</p>
            <input type="checkbox" id="html" name="interesse" value="HTML"> <label for="html">HTML</label><br>
            <input type="checkbox" id="css" name="interesse" value="CSS"> <label for="css">CSS</label><br>
            <input type="checkbox" id="js" name="interesse" value="JavaScript"> <label
                for="js">JavaScript</label><br><br>
            <label for="nivel">Seu nível:</label>
            <select id="nivel" name="nivel">
                <option value="Iniciante">Iniciante</option>
                <option value="Intermediário">Intermediário</option>
                <option value="Avançado">Avançado</option>
            </select>
            <label for="mensagem">Mensagem:</label>
            <textarea id="mensagem" name="mensagem" rows="4" placeholder="Escreva algo..."></textarea>
        </fieldset>
        <button type="submit">Enviar</button>
        <button type="reset">Limpar</button>
    </form>
</body>

</html>
